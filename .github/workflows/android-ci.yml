name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/ListenSphere.Mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK 34 and Build Tools 34
        run: sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v6

      - name: Build Debug APK and run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug testDebugUnitTest --no-daemon

      - name: Upload Android test XML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-results
          path: apps/ListenSphere.Mobile/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: apps/ListenSphere.Mobile/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
